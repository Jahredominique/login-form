<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="login-form.css"/>
</head>
<body>
    <div class="image-container">
        <img src="images/image-photo.jpg"/>
    </div>

    <div class="triangle">
        <img src="images/triangle.png" alt=""/>
    </div>

<main>

    <form action="#">
        <h2>Flat Business Profile Widget</h2>
        
        <div class="form-field">
            <img src="images/user.png" alt="user"/>
        </div>
        
        <div>
            <input type="text" class="name" placeholder="name"/>
        </div>
        
        <i class="fa fa-user" aria-hidden="true"></i>

        <div class="form-field">
            <img src="images/pass.png" alt="password"/>
        </div>

        <div>
            <input type="text" class="password" placeholder="*********"/>
        </div>

        <i class="fa fa-unlock-alt" aria-hidden="true"></i>

        <input type="submit" class="submit"/>

        



    </form>

    
</main>
    <footer><p>&copy; 2016 Flat Business Profile Widget. All rights reserved</p></footer>
</body>
</html>
